<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Successful</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0fff4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 26px; font-weight: 800; color: #1a1a2e; margin-bottom: 10px; }
    p { color: #666; font-size: 15px; line-height: 1.6; }
    .details {
      background: #f7fff9;
      border: 1px solid #c6f6d5;
      border-radius: 10px;
      padding: 16px;
      margin: 24px 0;
      text-align: left;
      font-size: 14px;
    }
    .details div { display: flex; justify-content: space-between; padding: 4px 0; color: #333; }
    .details .label { color: #888; }
    .btn {
      display: inline-block;
      background: #38a169;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      padding: 13px 32px;
      font-size: 15px;
      font-weight: 700;
      margin-top: 8px;
    }
    .btn:hover { background: #2f855a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Payment Successful!</h1>
    <p>Thank you! Your payment has been processed successfully.</p>

    <div class="details" id="details">
      <div><span class="label">Status</span><span style="color:#38a169;font-weight:700">Paid</span></div>
      <div><span class="label">Session ID</span><span id="sessionId" style="font-size:11px">Loading...</span></div>
      <div><span class="label">Amount</span><span id="amount">—</span></div>
      <div><span class="label">Email</span><span id="email">—</span></div>
    </div>

    <a class="btn" href="/pay.html">Make Another Payment</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');

    if (sessionId) {
      document.getElementById('sessionId').textContent = sessionId.slice(0, 24) + '...';

      fetch(`/.netlify/functions/verify-session?session_id=${sessionId}`)
        .then(r => r.json())
        .then(data => {
          if (data.success) {
            document.getElementById('amount').textContent = '$' + data.amount_total + ' ' + data.currency.toUpperCase();
            document.getElementById('email').textContent = data.customer_email || '—';
          }
        })
        .catch(() => {});
    }
  </script>
</body>
</html>
