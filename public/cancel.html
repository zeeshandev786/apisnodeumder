<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Cancelled</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 26px; font-weight: 800; color: #1a1a2e; margin-bottom: 10px; }
    p { color: #666; font-size: 15px; line-height: 1.6; }
    .btn {
      display: inline-block;
      background: #635bff;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      padding: 13px 32px;
      font-size: 15px;
      font-weight: 700;
      margin-top: 28px;
    }
    .btn:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">❌</div>
    <h1>Payment Cancelled</h1>
    <p>Your payment was cancelled and you have not been charged.<br/>You can try again whenever you're ready.</p>
    <a class="btn" href="/pay.html">Try Again</a>
  </div>
</body>
</html>
